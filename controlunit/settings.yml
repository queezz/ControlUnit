Settings Version: 1.9
# Define your local settings in
# localsettings = os.path.join(os.path.expanduser('~'),'.controlunit', 'settings.yml')
# ~/.controlunit/settings.yml
# If settings items are changed and settings version is higher then
# the local one, local settings are ignored.

# Data Path: use leading '~' to specify path in user directory
# Data Folder: ~/work/cudata
Data Folder: ~/work/cudata #
# Save the info from Log Dock to this file in Data Folder
Log File: controlunit.log

Sampling Time: 0.1 # Default sampling rate
Debug.Raw ADC: false
Verbose.Plasma Current PID: false

# The plasma-current loop with no discharge to regulate. Engaged on an unlit
# source it starts at Cold Start, walks the cathode drive up at Unlit Ramp,
# and never passes Unlit Ceiling until the plasma lights; then it regulates
# from the drive it has reached. A discharge is lit above Lit Above, and
# unlit once the current has stayed below it for Unlit After seconds, so an
# arc's short dropout is not taken for the plasma going out. A plasma that
# goes out under the loop keeps the drive it was lit at, or is walked up to
# this ceiling if it was lit below it (4.30.0).
Plasma Current PID:
  Cold Start mV: 1000
  Unlit Ramp mV per s: 25
  Unlit Ceiling mV: 1900
  Lit Above A: 0.1
  Unlit After s: 2.0

# ================================================
#
# MAX6675
# Cold-Junction-Compensated K-Thermocoupleto-Digital Converter (0C to +1024C)
# https://www.analog.com/media/en/technical-documentation/data-sheets/MAX6675.pdf
#
# ================================================
# Set maximum temperature for
# Temperature Control and for Analog Gauge widget
Max Temperature: 1000

# Channel Selector
MAX6675 Channel: 0 # 0 -> CS0, 1 -> CS1 Thermocouple
# GPIO pin used to turn on Heatr (via relay)
Heater GPIO: 17
# GPIO pin to turn on LED indicator (front panel)
# The same pin is used to send sync signal to QMS
LED GPIO: 26
# Temperature worker column names
Temperature Columns:
  - "date"
  - "time"
  - "T"
  - "PresetT"

# ================================================
#
# 32 channel 16-Bit ADC based on ADS1115
# https://www.y2c.co.jp/i2c-r/aio-32-0ra-irc/
# https://www.ti.com/lit/ds/symlink/ads1113.pdf
# https://www.nxp.com/docs/en/data-sheet/PCA9554B_PCA9554C.pdf
# https://www.ti.com/lit/ds/symlink/cd74hc4067.pdf
#
# ================================================

# Setup ADC channes. Choose a short speaking name for each signal.
# Gain - maximum accepted voltage [1,2,5,10]
# Channel - 0-31 (Need to confirm the numbering)
# Description - give a proper description of the signal
# Conversion Function:
#  - "Ionization Gauge"
#  - "Pfeiffer Single Gauge"
#  - "Hall Sensor"
#  - "Baratron"  # Baratron with range 0.1
#     If function is "Baratron", spesify its Full Scale in Torr
#     tag = Full Scale
# - "No Conversion" # If no conversion neededt
#
# An "Ionization Gauge" channel also names the two record columns that carry
# the mode (0 Torr linear, 1 Pa log, 2 off: converted value NaN) and the exponent its controller was set
# to when each row was taken: Mode Column and Scale Column, both listed under
# ADC Additional Columns below. Each gauge has its own pair, set from its own
# selector on the Control dock and the web Control tab. The first gauge keeps
# the columns the file has always had, IGmode and IGscale, so an old file
# and a new one read the same. An "Ionization Gauge" channel may also carry
# a Place, the word for where it sits (e.g. "upstream", "downstream"), shown
# beside its short name on the Control dock and the web Gauges card.
#
# An "Ionization Gauge" channel may also name its Diagram Element, the id the
# PIHTI Diagram (the vacuum diagram on the same Pi) gives that gauge. Its mode
# then follows what operators record there: switched off in the Diagram, the
# gauge is declared Off here; switched on, it goes back to Torr or Pa. Only a
# change in the Diagram moves it, so a press on the dock or in a browser holds
# until the Diagram changes again. A gauge without the key is not followed.
# (queezz, 2026-11-13: "Gauge left off, maybe we sync from the journal? Why
# should we turn that off twice??")

ADC Channels:
  Ip:
    Channel: 0
    Gain: 5
    Description: "Plasma Current"
    Conversion Function: "Hall Sensor"
    Supply Channel: "Vhall"
    Nominal Supply: 5.0
    # Where the sensor rests with no current, as a fraction of its supply.
    # Measured 2026-10-02 over two quiet stretches of one run (0.49609 and
    # 0.49603) and on 2026-09-30; the ideal 0.5 read -0.098 A with no plasma.
    Zero Ratio: 0.4961
    Amperes Per Volt: 5.0
    # The Live tab's chart steps Ip aside while every reading in its window,
    # through a 5-point median, stays within this many amperes of zero; the
    # first reading beyond brings it back. Measured with nothing flowing on
    # 2026-11-16 (docs/diagnostics/2026-11-18-quiet-rig-noise.md): through
    # the median, quiet Ip stays within 42 mA zeroed and 57 mA un-zeroed at
    # 10 Hz, 31 mA at 1 s, 22 mA at 10 s; a discharge starts near 0.12 A.
    # Display only: nothing recorded changes.
    Quiet Within: 0.06
    Supply Minimum: 4.0
    Supply Maximum: 6.0
  Vhall:
    Channel: 1
    # 5 V range clips at 5.0176 V; leave headroom for the PSU.
    Gain: 10
    Description: "Hall sensor supply reference (V), wired 2026-09-30"
    Conversion Function: "No Conversion"
  Pu:
    Channel: 26
    Gain: 10
    Description: "Pfeffer  Single Gauge (upstream)"
    Conversion Function: "Pfeiffer Single Gauge"
    #Conversion Function: "Pfeiffer IKR251"
  Pd:
    Channel: 24
    Gain: 10
    Description: "Ionization Gauge (downstream)"
    Conversion Function: "Ionization Gauge"
    Mode Column: "IGmode"
    Scale Column: "IGscale"
    Place: "downstream"
    Diagram Element: "downstream-ionization-gauge"
  Pu2:
    Channel: 16
    Gain: 10
    Description: "Ionization Gauge (upstream), wired 2026-09-15"
    Conversion Function: "Ionization Gauge"
    Mode Column: "IGmode_Pu2"
    Scale Column: "IGscale_Pu2"
    Place: "upstream"
    # The Diagram labels this id "Upstream ionization gauge".
    Diagram Element: "bypass-ionization-gauge"
  Bu:
    Channel: 20
    Gain: 1
    Description: "Baratron MKS 627 FS = 1 Torr (upstream)"
    Conversion Function: "Baratron"
    Full Scale: 1.0
  Bd:
    Channel: 22
    Gain: 1
    Description: "Baratron MKS 628B.1TDF2b FS = 0.1 Torr (downstream)"
    Conversion Function: "Baratron"
    Full Scale: 0.1
  MFC1:
    Channel: 30
    Gain: 5
    Description: "MFC for Hydrogen, 20 SCCM"
    Conversion Function: "No Conversion"
  MFC2:
    Channel: 28
    Gain: 5
    Description: "MFC2 for Oxygen, 10 SCCM"
    Conversion Function: "No Conversion"
  Ci:
    Channel: 7
    Gain: 1
    Description: "cathode current"
    Conversion Function: "cathode current"
  Cv:
    Channel: 8
    Gain: 1
    Description: "cathode volt"
    Conversion Function: "cathode volt"

ADC Additional Columns:
  - "date"
  - "time"
  - "IGmode"
  - "IGscale"
  - "QMS_signal"
  - "PresetV_mfc1"
  - "PresetV_mfc2"
  - "PresetV_cathode"
  # Appended, never inserted: the columns before them keep their positions.
  - "IGmode_Pu2"
  - "IGscale_Pu2"

